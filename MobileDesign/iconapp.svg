<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fond Noir (Dark Mode) -->
  <rect width="512" height="512" fill="#0A0A0F" rx="112" />
  
  <defs>
    <!-- Dégradé de Bleu vers Mauve -->
    <linearGradient id="gradBlueMauve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" /> <!-- Bleu profond/néon -->
      <stop offset="100%" stop-color="#D24DFF" /> <!-- Mauve -->
    </linearGradient>
    
    <!-- Effet de lueur subtil (Glow) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Icône remontée (translate Y à 210 au lieu de 256) pour laisser la place au texte, tout en gardant l'agrandissement de 30% -->
  <g transform="translate(256, 210) scale(1.3) translate(-220, -245)">
    <!-- Ligne de battement (EKG) qui se transforme en contour d'oreille -->
    <path d="M 90,250 
             L 120,250 
             L 140,170 
             L 170,330 
             L 200,210 
             L 220,250
             L 230,250
             C 230,130 330,130 340,230 
             C 350,320 290,360 250,340 
             C 230,330 240,290 260,290" 
          fill="none" 
          stroke="url(#gradBlueMauve)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neonGlow)" />
          
    <!-- Détail interne en Blanc pur pour bien identifier le cartilage de l'oreille -->
    <path d="M 270,190 
             C 310,200 300,260 270,280" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="14" 
          stroke-linecap="round" />
  </g>

  <!-- Typographie du logo en Blanc -->
  <text x="256" y="440" font-family="Montserrat, Inter, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="10">SONORA</text>
</svg>
